<style>
  :root {
    --bg: #0B0F17;
    --bg-2: #0F1521;
    --panel: #111827;
    --panel-2: #0A0F1A;
    --line: #1E293B;
    --line-2: #334155;
    --text: #E2E8F0;
    --text-dim: #94A3B8;
    --text-fade: #64748B;
    --accent: #3B82F6;
    --accent-2: #60A5FA;
    --warn: #F59E0B;
    --ok: #10B981;
    --err: #EF4444;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    font-family: var(--mono);
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  ::selection { background: rgba(59,130,246,0.35); color: #fff; }

  /* ---- CAD grid background ---- */
  #grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px),
      linear-gradient(rgba(59,130,246,0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.10) 1px, transparent 1px);
    background-size: 32px 32px, 32px 32px, 160px 160px, 160px 160px;
    opacity: 0;
    animation: gridIn 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s forwards;
  }
  @keyframes gridIn { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    #grid-bg { animation: none; opacity: 1; }
  }

  /* ---- Top bar / Title bar ---- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    height: 52px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px;
    background: rgba(11,15,23,0.78);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  #topbar .brand {
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  #topbar .brand .logo {
    width: 30px; height: 30px; flex-shrink: 0;
    transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #topbar .brand:hover .logo { transform: rotate(-6deg) scale(1.05); }

  #topbar .brand .titles { display: flex; flex-direction: column; line-height: 1.1; }
  #topbar .brand .name {
    font-weight: 700; font-size: 14px; letter-spacing: 0.04em;
    color: var(--text);
  }
  #topbar .brand .name em {
    font-style: normal; color: var(--accent);
  }
  #topbar .brand .sub {
    font-size: 10.5px; color: var(--text-fade);
    letter-spacing: 0.08em; text-transform: uppercase;
    margin-top: 2px;
  }

  #topbar .divider {
    width: 1px; height: 22px; background: var(--line);
  }

  #topbar .tag-row {
    display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; font-size: 10.5px; font-weight: 500;
    border: 1px solid var(--line-2);
    border-radius: 3px;
    color: var(--text-dim);
    background: var(--panel-2);
    white-space: nowrap;
  }
  .tag .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-fade);
  }
  .tag.ok .dot { background: var(--ok); box-shadow: 0 0 6px rgba(16,185,129,0.6); animation: pulse 2.2s ease-in-out infinite; }
  .tag.blue { border-color: rgba(59,130,246,0.4); color: var(--accent-2); background: rgba(59,130,246,0.08); }

  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.45; }
  }

  #topbar .spacer { flex: 1; min-width: 12px; }

  #topbar .actions {
    display: flex; align-items: center; gap: 6px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    font-family: var(--mono); font-size: 12px; font-weight: 500;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s cubic-bezier(0.2, 0.7, 0.2, 1);
    white-space: nowrap;
    text-decoration: none;
  }
  .btn:hover {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(59,130,246,0.08);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }
  .btn.primary {
    color: #fff;
    background: linear-gradient(180deg, #3B82F6 0%, #2563EB 100%);
    border-color: #2563EB;
    box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 6px 18px -8px rgba(37,99,235,0.6);
  }
  .btn.primary:hover {
    box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 8px 22px -8px rgba(37,99,235,0.8);
    border-color: #60A5FA;
  }
  .btn svg { width: 13px; height: 13px; }
  .btn kbd {
    font-family: var(--mono); font-size: 10px;
    padding: 1px 4px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 2px;
    color: var(--text-dim);
  }

  @media (max-width: 720px) {
    #topbar { height: auto; min-height: 52px; padding: 10px 14px; flex-wrap: wrap; gap: 10px; }
    #topbar .divider { display: none; }
    #topbar .tag-row { order: 3; width: 100%; overflow-x: auto; padding-bottom: 2px; }
    .btn kbd { display: none; }
  }

  /* ---- Upload screen ---- */
  #upload {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 72px 20px 120px;
    opacity: 0; transform: translateY(6px);
    animation: uploadIn 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) 0.35s forwards;
  }
  #upload.hidden { display: none; }
  @keyframes uploadIn { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    #upload { animation: none; opacity: 1; transform: none; }
  }

  .panel {
    width: min(560px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.03) inset,
      0 40px 80px -30px rgba(0,0,0,0.8),
      0 10px 30px -15px rgba(59,130,246,0.25);
  }
  .panel::before {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    border-radius: inherit;
    box-shadow: 0 0 0 1px rgba(59,130,246,0.08) inset;
  }

  /* Window title bar for panel */
  .panel-head {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
  }
  .traffic { display: flex; gap: 6px; }
  .traffic span {
    width: 10px; height: 10px; border-radius: 50%;
    display: block;
  }
  .traffic span:nth-child(1) { background: #EF4444; }
  .traffic span:nth-child(2) { background: #F59E0B; }
  .traffic span:nth-child(3) { background: #10B981; }
  .panel-head .window-title {
    margin-left: 8px;
    font-size: 11px; color: var(--text-fade);
    letter-spacing: 0.04em;
  }
  .panel-head .window-title em {
    font-style: normal; color: var(--warn);
    font-weight: 500;
  }
  .panel-head .prompt {
    margin-left: auto;
    font-size: 11px; color: var(--accent-2);
  }
  .panel-head .prompt::before { content: "\u00A7 "; color: var(--text-fade); }

  .panel-body { padding: 26px 28px 28px; }

  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 10.5px;
    color: var(--accent-2);
    letter-spacing: 0.18em; text-transform: uppercase;
    margin-bottom: 12px;
  }
  .eyebrow::before {
    content: "";
    width: 18px; height: 1px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  .panel h1 {
    margin: 0 0 6px;
    font-size: 26px; font-weight: 700; line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .panel h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 60%, var(--warn) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .panel .lede {
    margin: 0 0 22px;
    font-size: 13px; line-height: 1.65;
    color: var(--text-dim);
  }
  .panel .lede strong {
    color: var(--text); font-weight: 600;
  }

  /* Dropzone */
  .drop {
    position: relative;
    display: block;
    padding: 30px 24px 26px;
    border-radius: 4px;
    background: var(--panel-2);
    border: 1.5px dashed var(--line-2);
    text-align: center;
    cursor: pointer;
    transition:
      border-color 0.2s cubic-bezier(0.2, 0.7, 0.2, 1),
      background 0.2s cubic-bezier(0.2, 0.7, 0.2, 1),
      transform 0.2s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .drop::after {
    content: "";
    position: absolute; inset: 4px;
    border: 1px dashed transparent;
    border-radius: 3px;
    transition: border-color 0.2s, box-shadow 0.2s;
    pointer-events: none;
  }
  .drop:hover, .drop.drag {
    border-color: var(--accent);
    background: rgba(59,130,246,0.06);
    transform: translateY(-1px);
  }
  .drop.drag {
    border-color: var(--warn);
    background: rgba(245,158,11,0.08);
  }
  .drop.drag::after {
    border-color: rgba(245,158,11,0.35);
    box-shadow: 0 0 0 3px rgba(245,158,11,0.08);
  }

  .drop .drop-icon {
    width: 48px; height: 48px;
    margin: 0 auto 14px;
    display: block;
    color: var(--accent-2);
    transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1), color 0.2s;
  }
  .drop:hover .drop-icon { transform: translateY(-3px); color: var(--accent); }
  .drop.drag .drop-icon { color: var(--warn); transform: translateY(-4px) scale(1.06); }

  .drop .drop-title {
    font-size: 14px; font-weight: 600;
    color: var(--text);
  }
  .drop .drop-title strong {
    color: var(--accent-2);
    font-weight: 700;
  }
  .drop .drop-hint {
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--text-fade);
    line-height: 1.5;
  }
  .drop .drop-hint .chips {
    margin-top: 10px;
    display: flex; gap: 6px; justify-content: center;
  }
  .chip {
    display: inline-flex; align-items: center;
    padding: 2px 8px;
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.04em;
    border: 1px solid var(--line-2);
    border-radius: 2px;
    color: var(--text-dim);
    background: var(--panel);
    font-family: var(--mono);
  }
  .chip.blue { color: var(--accent-2); border-color: rgba(59,130,246,0.4); }
  .chip.amber { color: var(--warn); border-color: rgba(245,158,11,0.4); }
  #file { display: none; }

  /* Feat list */
  .feat-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-top: 18px;
  }
  .feat {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--panel-2);
    transition: border-color 0.15s, transform 0.15s;
  }
  .feat:hover { border-color: var(--accent); transform: translateY(-1px); }
  .feat .ico {
    width: 22px; height: 22px; margin-bottom: 6px;
    color: var(--accent-2);
  }
  .feat .t { font-size: 11.5px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .feat .s { font-size: 10.5px; color: var(--text-fade); line-height: 1.4; }

  @media (max-width: 560px) {
    .panel-body { padding: 22px 18px 22px; }
    .panel h1 { font-size: 22px; }
    .feat-row { grid-template-columns: 1fr; }
  }

  /* ---- CAD viewer mount point ---- */
  #app { position: fixed; inset: 0; z-index: 5; }
  #app:empty { display: none; }
  #app:not(:empty) ~ #topbar { background: rgba(11,15,23,0.88); }

  /* ---- Terminal / status log ---- */
  #status {
    position: fixed;
    left: 16px; bottom: 16px; right: auto;
    z-index: 40;
    min-width: 320px;
    max-width: min(560px, calc(100vw - 32px));
    max-height: 34vh;
    padding: 10px 12px;
    background: rgba(10,14,22,0.96);
    border: 1px solid var(--line-2);
    border-top: 2px solid var(--accent);
    border-radius: 3px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11.5px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
    display: none;
    overflow-y: auto;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.9), 0 4px 12px -6px rgba(0,0,0,0.6);
  }
  #status.error {
    border-top-color: var(--err);
    color: #FECACA;
    background: rgba(58,10,10,0.96);
  }
  #status.error .stamp { color: #F87171; }
  #status:not(:empty) { display: block; }
  #status::-webkit-scrollbar { width: 6px; }
  #status::-webkit-scrollbar-track { background: transparent; }
  #status::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

  .stamp {
    color: var(--text-fade);
    margin-right: 6px;
    user-select: none;
  }
  .lvl-ok { color: var(--ok); }
  .lvl-warn { color: var(--warn); }
  .lvl-info { color: var(--accent-2); }
  .lvl-err { color: var(--err); }
  .caret {
    display: inline-block;
    width: 7px; height: 13px;
    background: var(--accent-2);
    vertical-align: -2px;
    margin-left: 2px;
    animation: blink 1.05s steps(1, end) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }

  /* Viewer mode: add a re-open button when inside viewer */
  #viewer-bar {
    display: none;
    align-items: center; gap: 6px;
  }
  #app:not(:empty) ~ #topbar #viewer-bar { display: inline-flex; }
</style>

<div id="app"></div>
<pre id="status" role="log" aria-live="polite"></pre>

<script type="module">
const ML = '1.5.11'
const npm = (pkg, path = '') => `https://cdn.jsdelivr.net/npm/${pkg}${path}`
const CAD_VIEWER_URL = npm(`@mlightcad/cad-viewer@${ML}`, '/dist/cad-viewer.js')
const BASE_URL = 'https://cdn.jsdelivr.net/gh/mlightcad/cad-data@main/'
const DWG_WORKER = npm(`@mlightcad/cad-simple-viewer@${ML}`, '/dist/libredwg-parser-worker.js')
const CSS_SHIM = null

const EXACT = {
  vue: npm('vue@3.4.21', '/dist/vue.esm-browser.prod.js'),
  'vue-demi': npm('vue-demi@0.14.10', '/lib/index.mjs'),
  'vue-i18n': npm('vue-i18n@11.4.4', '/dist/vue-i18n.esm-browser.prod.js'),
  'element-plus': npm('element-plus@2.12.0', '/dist/index.full.mjs'),
  'element-plus/es': npm('element-plus@2.12.0', '/es/index.mjs'),
  'element-plus/dist/index.css': CSS_SHIM,
  '@element-plus/icons-vue': npm('@element-plus/icons-vue@2.3.1', '/dist/index.js'),
  three: npm('three@0.172.0', '/build/three.module.js'),
  'lodash-es': npm('lodash-es@4.17.21', '/+esm'),
  'lodash-unified': npm('lodash-unified@1.0.3', '/import.js'),
  '@vue/shared': npm('@vue/shared@3.4.21', '/+esm'),
  '@vueuse/core': npm('@vueuse/core@11.1.0', '/index.mjs'),
  '@vueuse/shared': npm('@vueuse/shared@11.1.0', '/index.mjs'),
  'async-validator': npm('async-validator@4.2.5', '/dist-web/index.js'),
  dayjs: npm('dayjs@1.11.13', '/+esm'),
  'escape-html': npm('escape-html@1.0.3', '/+esm'),
  'memoize-one': npm('memoize-one@6.0.0', '/dist/memoize-one.esm.js'),
  'normalize-wheel-es': npm('normalize-wheel-es@1.2.0', '/+esm'),
  '@ctrl/tinycolor': npm('@ctrl/tinycolor@4.1.0', '/dist/module/index.js'),
  '@floating-ui/dom': npm('@floating-ui/dom@1.6.13', '/+esm'),
  '@popperjs/core': npm('@popperjs/core@2.11.8', '/lib/index.js'),
  '@mlightcad/cad-simple-viewer': npm(`@mlightcad/cad-simple-viewer@${ML}`, '/+esm'),
  '@mlightcad/data-model': npm('@mlightcad/data-model@1.12.5', '/+esm'),
  '@mlightcad/three-renderer': npm(`@mlightcad/three-renderer@${ML}`, '/+esm'),
  '@mlightcad/cad-agent-plugin': npm(`@mlightcad/cad-agent-plugin@${ML}`, '/+esm'),
  '@mlightcad/cad-agent-plugin/register': npm(`@mlightcad/cad-agent-plugin@${ML}`, '/register/+esm'),
  '@mlightcad/cad-agent-plugin/style.css': CSS_SHIM,
  '@mlightcad/cad-html-plugin': npm(`@mlightcad/cad-html-plugin@${ML}`, '/+esm'),
  '@mlightcad/cad-html-plugin/register': npm(`@mlightcad/cad-html-plugin@${ML}`, '/register/+esm'),
  '@mlightcad/cad-pdf-plugin': npm(`@mlightcad/cad-pdf-plugin@${ML}`, '/+esm'),
  '@mlightcad/cad-pdf-plugin/register': npm(`@mlightcad/cad-pdf-plugin@${ML}`, '/register/+esm'),
  '@mlightcad/cad-svg-plugin': npm(`@mlightcad/cad-svg-plugin@${ML}`, '/+esm'),
  '@mlightcad/cad-svg-plugin/register': npm(`@mlightcad/cad-svg-plugin@${ML}`, '/register/+esm'),
  './cad-viewer.css': CSS_SHIM
}

const statusEl = document.getElementById('status')
let typeTimer = null
function stamp() {
  const d = new Date()
  const pad = (n) => String(n).padStart(2, '0')
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`
}
function setStatus(msg, isError = false, { level = 'info', typing = true } = {}) {
  statusEl.classList.toggle('error', !!isError)
  const label = isError ? 'ERR ' : level === 'ok' ? ' OK  ' : level === 'warn' ? 'WARN ' : 'INFO '
  const cls = isError ? 'lvl-err' : level === 'ok' ? 'lvl-ok' : level === 'warn' ? 'lvl-warn' : 'lvl-info'
  const line = `<span class="stamp">[${stamp()}]</span> <span class="${cls}">${label}</span> ${msg}`
  if (!typing) { statusEl.innerHTML = line; return }
  if (typeTimer) { clearTimeout(typeTimer); typeTimer = null }
  statusEl.innerHTML = ''
  let i = 0
  const tick = () => {
    if (i <= line.length) {
      statusEl.innerHTML = line.slice(0, i) + (i < line.length ? '<span class="caret"></span>' : '')
      i++
      typeTimer = setTimeout(tick, Math.max(3, Math.floor(1800 / Math.max(line.length, 20))))
    }
  }
  tick()
}

function resolveSpec(spec) {
  if (Object.prototype.hasOwnProperty.call(EXACT, spec)) return EXACT[spec]
  if (spec.endsWith('.css') || spec.endsWith('/style/css')) return CSS_SHIM
  if (spec.startsWith('element-plus/es/locale/lang/')) {
    return npm('element-plus@2.12.0', `/es/locale/lang/${spec.slice('element-plus/es/locale/lang/'.length)}.mjs`)
  }
  if (spec.startsWith('element-plus/es/components/')) {
    let rest = spec.slice('element-plus/es/'.length)
    if (rest.endsWith('/index')) rest += '.mjs'
    return npm('element-plus@2.12.0', `/es/${rest}`)
  }
  if (spec.startsWith('three/')) {
    let rest = spec.slice(6)
    if (spec.startsWith('three/examples/jsm/') && !/\.[a-z0-9]+$/i.test(rest)) rest += '.js'
    return npm('three@0.172.0', `/${rest}`)
  }
  if (spec.startsWith('lodash-es/')) return npm('lodash-es@4.17.21', `/${spec.slice(10)}`)
  if (spec.startsWith('dayjs/plugin/')) return npm('dayjs@1.11.13', `/plugin/${spec.slice(13)}/+esm`)
  if (spec.startsWith('dayjs/locale/')) {
    let rest = spec.slice(13)
    if (!/\.[a-z0-9]+$/i.test(rest)) rest += '.js'
    return npm('dayjs@1.11.13', `/locale/${rest}/+esm`)
  }
  if (spec.startsWith('dayjs/')) return npm('dayjs@1.11.13', `/${spec.slice(6)}/+esm`)
  if (spec.startsWith('@vueuse/')) return npm(`${spec}@11.1.0`, '/index.mjs')
  if (spec.startsWith('./') || spec.startsWith('../')) return new URL(spec, CAD_VIEWER_URL).href
  if (/^https?:/.test(spec)) return spec
  return undefined
}
function collectSpecs(source) {
  const specs = new Set()
  for (const re of [/\bfrom\s*["']([^"']+)["']/g, /\bimport\s*["']([^"']+)["']/g, /\bimport\s*\(\s*["']([^"']+)["']\s*\)/g]) {
    let m
    while ((m = re.exec(source))) {
      if (m[1] && !m[1].includes('{')) specs.add(m[1])
    }
  }
  return specs
}
function rewriteCadViewer(source) {
  const specs = collectSpecs(source)
  const bad = [...specs].filter((s) => resolveSpec(s) === undefined)
  if (bad.length) throw new Error(`Unresolved imports: ${bad.join(', ')}`)
  let out = source
  for (const spec of [...specs].filter((s) => resolveSpec(s) === CSS_SHIM)) {
    const esc = spec.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    out = out
      .replace(new RegExp(`\\bimport\\s*["']${esc}["']\\s*;?`, 'g'), '')
      .replace(new RegExp(`\\bimport\\s+[^;\\n]*?\\s+from\\s*["']${esc}["']\\s*;?`, 'g'), '')
  }
  for (const spec of [...specs].sort((a, b) => b.length - a.length)) {
    const resolved = resolveSpec(spec)
    if (!resolved) continue
    const esc = spec.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    out = out
      .replace(new RegExp(`(from\\s*["'])${esc}(["'])`, 'g'), `$1${resolved}$2`)
      .replace(new RegExp(`(import\\s*["'])${esc}(["'])`, 'g'), `$1${resolved}$2`)
      .replace(new RegExp(`(import\\s*\\(\\s*["'])${esc}(["']\\s*\\))`, 'g'), `$1${resolved}$2`)
  }
  const exports = [...out.matchAll(/\bexport\s*\{([\s\S]*?)\}\s*;?/g)]
  if (!exports.length) throw new Error('cad-viewer.js final export not found')
  const last = exports[exports.length - 1]
  const map = new Map()
  for (const part of last[1].split(',').map((s) => s.trim()).filter(Boolean)) {
    const m = part.match(/^([A-Za-z_$][\w$]*)\s+as\s+([A-Za-z_$][\w$]*)$/)
    if (m) map.set(m[2], m[1])
    else map.set(part, part)
  }
  const MlCadViewer = map.get('MlCadViewer')
  const i18n = map.get('i18n')
  if (!MlCadViewer || !i18n) throw new Error('MlCadViewer/i18n missing from cad-viewer export')
  const bridge = `\n;globalThis.__MLIGHTCAD_INLINE_EXPORTS__={MlCadViewer:${MlCadViewer},i18n:${i18n}};\n`
  return out.slice(0, last.index) + bridge + out.slice(last.index + last[0].length)
}
async function loadInlineCadViewer() {
  setStatus('fetching cad-viewer.js from CDN\u2026', false, { level: 'info' })
  const source = await fetch(CAD_VIEWER_URL, { cache: 'force-cache' }).then((r) => {
    if (!r.ok) throw new Error(`HTTP ${r.status} for cad-viewer.js`)
    return r.text()
  })
  setStatus(`rewriting module graph (${(source.length / 1024 / 1024).toFixed(2)} MB)\u2026`, false, { level: 'info' })
  const rewritten = rewriteCadViewer(source)
  delete globalThis.__MLIGHTCAD_INLINE_EXPORTS__
  const script = document.createElement('script')
  script.type = 'module'
  script.textContent = rewritten
  return new Promise((resolve, reject) => {
    const timer = setInterval(() => {
      if (globalThis.__MLIGHTCAD_INLINE_EXPORTS__) {
        clearInterval(timer)
        resolve(globalThis.__MLIGHTCAD_INLINE_EXPORTS__)
      }
    }, 25)
    script.onerror = (ev) => { clearInterval(timer); reject(ev?.error || new Error('Failed to run rewritten cad-viewer.js')) }
    document.head.appendChild(script)
  })
}
const runtimeReady = (async () => {
  setStatus('resolving CDN peers (vue / element-plus / three)\u2026', false, { level: 'info' })
  const [vue, elementPlus, simpleViewer, cadViewer] = await Promise.all([
    import('vue'),
    import('element-plus'),
    import('@mlightcad/cad-simple-viewer'),
    loadInlineCadViewer()
  ])
  setStatus('runtime ready \u00B7 awaiting input', false, { level: 'ok' })
  return { vue, elementPlus, simpleViewer, cadViewer }
})().catch((err) => { setStatus(err?.stack || String(err), true, { level: 'err' }); throw err })

function isCadFile(file) {
  const name = file.name.toLowerCase()
  return name.endsWith('.dwg') || name.endsWith('.dxf')
}
async function openFile(file) {
  if (!isCadFile(file)) {
    setStatus(`rejected: ${file.name} (unknown extension, expected .dwg / .dxf)`, true, { level: 'err' })
    return
  }
  const sizeMb = (file.size / 1024 / 1024).toFixed(2)
  setStatus(`opening ${file.name} \u00B7 ${sizeMb} MB`, false, { level: 'info' })
  const { vue, elementPlus, simpleViewer, cadViewer } = await runtimeReady
  const { createApp, h } = vue
  const { AcApDocManager } = simpleViewer
  const { MlCadViewer, i18n } = cadViewer
  const createInstance = AcApDocManager.createInstance.bind(AcApDocManager)
  AcApDocManager.createInstance = (options = {}) => createInstance({
    ...options,
    useMainThreadDraw: options.useMainThreadDraw ?? true,
    webworkerFileUrls: {
      dwgParser: URL.createObjectURL(new Blob([`import ${JSON.stringify(DWG_WORKER)};\n`], { type: 'text/javascript' })),
      ...options.webworkerFileUrls
    }
  })
  const uploadEl = document.getElementById('upload')
  uploadEl.style.transition = 'opacity 0.25s ease, transform 0.25s ease'
  uploadEl.style.opacity = '0'
  uploadEl.style.transform = 'translateY(8px)'
  setTimeout(() => uploadEl.classList.add('hidden'), 260)
  setStatus(`parsing document tree\u2026`, false, { level: 'info' })
  const app = createApp({
    render: () => h(MlCadViewer, { locale: 'en', localFile: file, useMainThreadDraw: true, baseUrl: BASE_URL })
  })
  app.use(i18n)
  app.use(elementPlus.default)
  app.mount('#app')
  setTimeout(() => {
    setStatus(`viewing: ${file.name} (renderer online)`, false, { level: 'ok' })
  }, 2500)
}

const drop = document.getElementById('drop')
const input = document.getElementById('file')
const topOpenBtn = document.getElementById('top-open-btn')
const reopenBtn = document.getElementById('reopen-btn')
function triggerFilePicker() { input.value = ''; input.click() }

drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); e.dataTransfer.dropEffect = 'copy' })
drop.addEventListener('dragleave', (e) => { if (e.target === drop || drop.contains(e.relatedTarget)) return; drop.classList.remove('drag') })
drop.addEventListener('drop', (e) => {
  e.preventDefault()
  drop.classList.remove('drag')
  const file = e.dataTransfer?.files?.[0]
  if (file) openFile(file).catch((err) => setStatus(err?.stack || String(err), true, { level: 'err' }))
})
input.addEventListener('change', () => {
  const file = input.files?.[0]
  if (file) openFile(file).catch((err) => setStatus(err?.stack || String(err), true, { level: 'err' }))
})
topOpenBtn.addEventListener('click', (e) => { e.preventDefault(); triggerFilePicker() })
if (reopenBtn) reopenBtn.addEventListener('click', (e) => { e.preventDefault(); triggerFilePicker() })

document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey
  if (mod && (e.key === 'o' || e.key === 'O')) { e.preventDefault(); triggerFilePicker() }
  if (e.key === 'Escape') {
    const app = document.getElementById('app')
    const uploadEl = document.getElementById('upload')
    if (app.innerHTML !== '') {
      const tmp = document.createElement('div')
      tmp.style.position = 'fixed'; tmp.style.inset = '0'; tmp.style.zIndex = '5'
      app.replaceWith(tmp); tmp.id = 'app'
      uploadEl.classList.remove('hidden')
      uploadEl.style.opacity = ''; uploadEl.style.transform = ''
      setStatus('returned to input screen', false, { level: 'info' })
    }
  }
})
window.addEventListener('dragover', (e) => {
  if (document.getElementById('app').innerHTML !== '') return
  e.preventDefault(); drop.classList.add('drag')
})
window.addEventListener('drop', (e) => {
  if (document.getElementById('app').innerHTML !== '') return
  e.preventDefault(); drop.classList.remove('drag')
  const file = e.dataTransfer?.files?.[0]
  if (file) openFile(file).catch((err) => setStatus(err?.stack || String(err), true, { level: 'err' }))
})
</script>
